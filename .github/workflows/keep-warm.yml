# Cold start is ~17 s locally (docs/latency.md): two transformers plus a 320 MB
# index, and a deploy adds the index download on top. Free and hobby tiers idle
# a service out after ~15 minutes, so without this the first visitor after a
# quiet period pays all of it. A ping every 10 minutes keeps it resident.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL secret is not set; nothing to ping."
            exit 0
          fi
          curl -fsS --max-time 60 "$DEPLOY_URL/health" | head -c 300
