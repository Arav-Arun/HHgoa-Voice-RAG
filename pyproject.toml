[project]
name = "hhgoa"
version = "0.1.0"
description = "Modular RAG framework for Hindi and Gujarati (MS MARCO-XI scope)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=5.7.0",
    # Pulled in by sentence-transformers anyway. Declared directly because uv
    # sources only bind a project's own dependencies, and without that binding
    # the CPU index below is ignored.
    "torch>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    # Only used by scripts/make_audio_fixtures.py, never imported at runtime.
    "gtts>=2.5.0",
]
# Building the index from Hugging Face needs this; answering never does, and the
# deployment fetches a prebuilt index at boot. Keeping it out of the base
# dependencies drops pyarrow and pandas from the serving image.
ingest = [
    "datasets>=5.0.1",
]

[project.scripts]
hhgoa = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ingest", "eval", "bench", "api"]

[tool.uv]
package = true

# On Linux, torch pulls 2.2 GB of CUDA wheels (measured) that never load:
# TORCH_DEVICE is cpu on every machine this runs on. macOS wheels are CPU-only
# already, so the marker leaves local development resolving from PyPI.
# explicit = true keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
